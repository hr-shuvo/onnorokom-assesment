

name: onnorokom-assesment

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: onnorokom
      POSTGRES_PASSWORD: onnorokom
      POSTGRES_DB: admission-db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "onnorokom", "-d", "admission-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./school-admission-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: postgres://onnorokom:onnorokom@db:5432/admission-db

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

  client:
    build: 
      context: ./school-admission-client
      args:
        - VITE_API_URL=http://localhost:8080
    ports:
      - "3000:80"


volumes:
  db_data:




  

  
